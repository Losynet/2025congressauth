<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Congresso 2025 (Bari 2) 25-27 Luglio  - Check-in 7:30 </title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0; /* Rimuovo il margine per far coprire lo sfondo l'intera pagina */
    padding: 20px; /* Aggiungo padding per distanziare il contenuto dai bordi */
    background-color: #f4f7f6;
    /* Immagine di sfondo perpetua. Puoi sostituire l'URL con un altro a tuo piacimento. */
    background-image: url('https://cms-imgp.jw-cdn.org/img/p/1102025198/univ/wpub/1102025198_univ_cnt_1_xl.jpg');
    color: #333;
    line-height: 1.6;
    /* Proprietà per gestire l'immagine di sfondo caricata dall'utente */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  h1 {
    text-align: center;
    font-size: 2.5em;
    text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6); /* Ombra per garantire la leggibilità */
    margin-top: 5vh; /* Spostato il titolo più in alto */
    margin-bottom: 0; /* Rimosso il margine inferiore per un controllo più preciso del layout */
    line-height: 1.2;
  }
  .title-line-1 {
    display: block;
    color: rgb(31, 68, 102);
  }
  .title-line-2 {
    display: block;
    color: rgb(72, 110, 73);
    font-size: 0.8em; /* Leggermente più piccolo per effetto sottotitolo */
    margin-top: 10px; /* Aggiunge spazio sopra la seconda riga */
  }
  h2 {
    color: #2c3e50;
    border-bottom: 2px solid #3498db;
    padding-bottom: 5px;
    margin-top: 0; /* Rimuoviamo il margine superiore di default */
  }
  .main-content-wrapper {
    display: flex;
    justify-content: center; /* Centra le card orizzontalmente */
    align-items: flex-start; /* Allinea le card in alto */
    gap: 25px; /* Spazio tra le card */
    flex-wrap: wrap; /* Permette alle card di andare a capo su schermi piccoli */
    margin-top: 22vh; /* Sposta le schede ancora più in basso */
    padding-bottom: 20px; /* Aggiunge spazio in fondo alla pagina per evitare che le card tocchino il bordo */
  }
  .section-container {
    background-color: rgba(255, 255, 255, 0.75); /* Sfondo reso ancora più trasparente */
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    flex: 1 1 400px; /* Permette alle card di crescere e restringersi, con una base di 400px */
    max-width: 550px; /* Limita la larghezza massima di ogni card */
  }
  .main-content-wrapper .section-container:nth-child(2) {
    /* Sposta la seconda card più in basso */
    margin-top: 60px;
  }
  #qrcodes {
    display: none; /* I QR code non vengono mostrati a schermo, ma solo generati per lo ZIP */
  }
  .qr-item {
    text-align: center;
    border: 1px solid #eee;
    padding: 10px;
    border-radius: 5px;
    background-color: #fcfcfc;
    flex: 0 0 calc(20% - 15px); /* Mostra circa 5 QR per riga */
    box-sizing: border-box; /* Include padding e border nel calcolo della larghezza */
    min-width: 150px; /* Larghezza minima per evitare che diventino troppo piccoli */
  }
  .qr-item img {
    width: 120px;
    height: 120px;
    display: block;
    margin: 0 auto 10px auto;
  }
  .scanner {
    width: 100%;
    max-width: 400px;
    margin: 20px auto 0 auto; /* Centra lo scanner orizzontalmente */
    border: 1px solid #ddd;
    border-radius: 5px;
    overflow: hidden;
  }
  button {
    margin: 10px 5px;
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    background-color: #3498db;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #2980b9;
  }
  button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
  input[type="file"] {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    background-color: #f9f9f9;
  }
  #checkin-log {
    list-style: none;
    padding: 0;
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 5px;
    margin-top: 15px;
  }
  #checkin-log li {
    padding: 10px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #checkin-log li:last-child {
    border-bottom: none;
  }
  .log-entry-text {
      flex-grow: 1;
  }
  .log-entry-time {
      font-size: 0.8em;
      color: #777;
      margin-left: 10px;
      white-space: nowrap;
  }
  .message {
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
  }
  .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  .message.warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

  /* Stili per schermi piccoli (es. cellulari e tablet) */
  @media (max-width: 992px) {
    .main-content-wrapper {
      justify-content: center; /* Mantiene la card principale centrata */
    }
  }
</style>
</head>
<body>
 
<h1>
  <span class="title-line-1">Congresso 2025 (Bari 2) 25-27 Luglio</span>
  <span class="title-line-2">Check-in 7:30</span>
</h1>

<div class="main-content-wrapper">
  <div class="section-container">
    <h2>Scanner Ingresso 📷</h2>
    <div id="reader" class="scanner"></div>
    <div class="message" id="scannerMessage" style="display:none;"></div>
    <ul id="checkin-log"></ul>
    <button id="downloadLog" style="display:none;">Scarica Log CSV 📊</button>
    <div class="message" id="logMessage" style="display:none;"></div>
  </div>
  <div class="section-container">
    <h2>Carica lista CSV 📂</h2>
    <p><b>Formato CSV:</b> ID,Nome Cognome,Reparto (es: <code style="background-color:#e0e0e0; padding: 2px 4px; border-radius: 3px;">INV001,Mario Rossi,Pulizie</code>)</p>
    <input type="file" id="fileInput" accept=".csv">
    <div class="message" id="csvMessage" style="display:none;"></div>
    <div id="qrcodes"></div>
    <button id="downloadZip" style="display:none;">Scarica tutti i QR (ZIP) 📦</button>
    <div class="message" id="zipMessage" style="display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
// Variabili globali per i dati dell'applicazione
let invited = []; // Array degli invitati dal CSV
let checkin = []; // Array dei check-in registrati

// Variabili per il debounce dello scanner (evita scansioni duplicate troppo veloci)
let lastScannedId = null;
let lastScanTime = 0;
const DEBOUNCE_TIME_MS = 2000; // 2 secondi di intervallo tra scansioni dello stesso ID

// Riferimenti agli elementi DOM per un accesso più facile
const fileInput = document.getElementById('fileInput');
const qrcodesContainer = document.getElementById('qrcodes');
const downloadZipButton = document.getElementById('downloadZip');
const readerDiv = document.getElementById('reader');
const checkinLogList = document.getElementById('checkin-log');
const downloadLogButton = document.getElementById('downloadLog');

// Messaggi di feedback per l'utente
const csvMessageDiv = document.getElementById('csvMessage');
const zipMessageDiv = document.getElementById('zipMessage');
const scannerMessageDiv = document.getElementById('scannerMessage');
const logMessageDiv = document.getElementById('logMessage');


/**
 * Mostra un messaggio di feedback all'utente.
 * @param {HTMLElement} elementDiv - L'elemento div dove mostrare il messaggio.
 * @param {string} message - Il testo del messaggio.
 * @param {string} type - Il tipo di messaggio ('success', 'error', 'warning').
 * @param {number} duration - Durata in ms dopo la quale nascondere il messaggio (default 5000ms).
 */
function showMessage(elementDiv, message, type, duration = 5000) {
  elementDiv.textContent = message;
  elementDiv.className = `message ${type}`;
  elementDiv.style.display = 'block';
  setTimeout(() => {
    elementDiv.style.display = 'none';
  }, duration);
}

// =========================================================================
// 1. Caricamento CSV e generazione QR Code
// =========================================================================

fileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) {
    showMessage(csvMessageDiv, "Nessun file selezionato.", "warning");
    return;
  }

  if (file.type !== 'text/csv' && !file.name.endsWith('.csv')) {
    showMessage(csvMessageDiv, "Per favore, seleziona un file CSV (.csv).", "error");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(event) {
    try {
      // Ignora la prima riga se è un'intestazione
      const lines = event.target.result.split('\n')
        .map(l => l.trim())
        .filter(l => l)
        .slice(1); // Ignora la riga di intestazione

      invited = []; // Resetta l'array degli invitati
      lines.forEach(line => {
        const parts = line.split(','); // Si aspetta la virgola come separatore, es: ID,Nome,Reparto
        if (parts.length >= 3) { // Ora ci aspettiamo almeno 3 parti: ID, Nome, Reparto
          const id = parts[0].trim();
          const name = parts[1].trim(); // Il nome è la seconda parte
          const department = parts.slice(2).join(',').trim(); // Il reparto è tutto il resto, per gestire virgole nel nome del reparto
          if (id && name && department) {
            invited.push({id: id, name: name, department: department});
          }
        }
      });

      if (invited.length > 0) {
        showQRCodes(invited);
        downloadZipButton.style.display = 'inline-block';
        showMessage(csvMessageDiv, `Caricati ${invited.length} invitati dal CSV.`, "success");
      } else {
        qrcodesContainer.innerHTML = '';
        downloadZipButton.style.display = 'none';
        showMessage(csvMessageDiv, "Nessun invitato valido trovato nel file CSV. Controlla il formato (ID,Nome Cognome,Reparto) e il separatore (virgola).", "warning");
      }
    } catch (error) {
      console.error("Errore durante la lettura o il parsing del CSV:", error);
      showMessage(csvMessageDiv, "Errore durante la lettura del file CSV. Assicurati che il formato sia corretto.", "error");
    }
  };
  reader.onerror = () => {
    console.error("Errore FileReader:", reader.error);
    showMessage(csvMessageDiv, "Impossibile leggere il file. Riprova.", "error");
  };
  reader.readAsText(file);
});

/**
 * Genera e mostra i QR code nella pagina.
 * @param {Array<Object>} data - Array di oggetti {id, name}.
 */
function showQRCodes(data) {
  qrcodesContainer.innerHTML = ''; // Pulisce i QR code esistenti
  data.forEach(person => {
    const div = document.createElement('div');
    div.className = 'qr-item';
    const p = document.createElement('p');
    p.textContent = `${person.name} (${person.id}) - ${person.department}`;
    div.appendChild(p);

    QRCode.toDataURL(person.id, { width: 120, margin: 1 }, function(err, url) {
      if (err) {
        console.error(`Errore nella generazione del QR per ${person.id} (visualizzazione):`, err);
        const errorSpan = document.createElement('span');
        errorSpan.textContent = "Errore QR";
        errorSpan.style.color = "red";
        div.appendChild(errorSpan);
      } else {
        const img = document.createElement('img');
        img.src = url;
        img.alt = `QR Code per ${person.name}`;
        div.appendChild(img);
      }
    });
    qrcodesContainer.appendChild(div);
  });
}

/**
 * Wrapper Promise per QRCode.toDataURL per l'uso con async/await.
 * @param {string} text - Il testo da codificare nel QR.
 * @returns {Promise<string>} - Una Promise che si risolve con la URL del QR code.
 */
function generateQRCodeAsync(text) {
  return new Promise((resolve, reject) => {
    // Aggiunto un margine per migliorare la leggibilità e la scansione dei QR code
    QRCode.toDataURL(text, { width: 300, margin: 2 }, function(err, url) {
      if (err) reject(err);
      else resolve(url);
    });
  });
}

downloadZipButton.addEventListener('click', async function() {
  if (invited.length === 0) {
    showMessage(zipMessageDiv, "Nessun invitato caricato per generare lo ZIP.", "warning");
    return;
  }

  const zip = new JSZip();
  let qrsGeneratedCount = 0;
  let qrsFailedCount = 0;

  showMessage(zipMessageDiv, "Generazione ZIP in corso... attendere ⏳", "warning", 10000); // Messaggio più lungo per l'attesa
  downloadZipButton.disabled = true; // Disabilita il pulsante durante la generazione

  try {
    for (const person of invited) {
      try {
        const dataUrl = await generateQRCodeAsync(person.id);
        // console.log(`Generato QR per ${person.id}:`, dataUrl ? "Successo" : "Fallito"); // Lascia per debug se necessario
        if (!dataUrl) {
          console.error(`Errore: dataUrl vuoto per ${person.id}.`);
          qrsFailedCount++;
          continue;
        }
        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
        // Costruisce il nome del file con la struttura ID_COGNOME_Nome_Reparto.png
        const nameParts = person.name.trim().split(' ');
        const lastName = nameParts.shift() || ''; // Estrae la prima parte (cognome)
        const firstName = nameParts.join(' '); // Unisce le parti rimanenti (nome)

        // Funzione helper per pulire le stringhe per i nomi dei file, sostituendo spazi e caratteri non validi con '_'
        const sanitize = (str) => str.trim().replace(/[^a-zA-Z0-9\s-]/g, '').replace(/[\s-]+/g, '_');

        // Combina le parti, omettendo quelle vuote per evitare doppi trattini bassi
        const fileName = [
            person.id,
            sanitize(lastName.toUpperCase()),
            sanitize(firstName),
            sanitize(person.department)
        ].filter(Boolean).join('_') + '.png';
        zip.file(fileName, base64Data, { base64: true });
        qrsGeneratedCount++;
      } catch (error) {
        console.error(`Errore nella generazione del QR per ${person.id} (ZIP):`, error);
        qrsFailedCount++;
      }
    }

    if (qrsGeneratedCount > 0) {
      const content = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 9 } });
      saveAs(content, "QR_Codes_Congresso.zip");
      let successMessage = `ZIP generato con successo! 🎉 ${qrsGeneratedCount} QR code inclusi.`;
      if (qrsFailedCount > 0) {
          successMessage += ` Attenzione: ${qrsFailedCount} QR code non sono stati inclusi nello ZIP a causa di errori.`;
          showMessage(zipMessageDiv, successMessage, "warning", 8000);
      } else {
          showMessage(zipMessageDiv, successMessage, "success", 5000);
      }
    } else {
      showMessage(zipMessageDiv, "Nessun QR code valido è stato generato per lo ZIP. L'archivio potrebbe essere vuoto.", "error");
    }

  } catch (error) {
    console.error("Errore nella creazione o download del file ZIP:", error);
    showMessage(zipMessageDiv, `Si è verificato un errore grave durante la creazione del file ZIP: ${error.message}`, "error", 8000);
  } finally {
    downloadZipButton.disabled = false; // Riabilita il pulsante
  }
});

// =========================================================================
// 2. Scanner Ingresso
// =========================================================================

/**
 * Funzione richiamata con successo dalla scansione del QR code.
 * @param {string} decodedText - Il testo decodificato dal QR code.
 */
function onScanSuccess(decodedText) {
  // Implementazione del debounce per evitare scansioni troppo ravvicinate dello stesso ID
  if (lastScannedId === decodedText && (Date.now() - lastScanTime) < DEBOUNCE_TIME_MS) {
      // console.log("Scansione duplicata ignorata a causa del debounce:", decodedText); // Per debug
      return;
  }

  // Aggiorna le variabili del debounce
  lastScannedId = decodedText;
  lastScanTime = Date.now();

  const person = invited.find(p => p.id === decodedText);
  const time = new Date().toLocaleString('it-IT');
  const li = document.createElement('li');
  li.classList.add('log-entry'); // Classe per stile

  const spanText = document.createElement('span');
  spanText.classList.add('log-entry-text');
  const spanTime = document.createElement('span');
  spanTime.classList.add('log-entry-time');
  spanTime.textContent = time;

  if (!person) {
    spanText.textContent = `❌ ID non autorizzato: ${decodedText}`;
    li.style.color = "red";
    showMessage(scannerMessageDiv, `ID "${decodedText}" non trovato nella lista invitati.`, "error", 4000);
  } else if (checkin.some(c => c.id === decodedText)) {
    spanText.textContent = `⚠️ Già registrato: ${person.name} (${person.id}) - ${person.department}`;
    li.style.color = "red"; // Cambiato da arancione a rosso
    showMessage(scannerMessageDiv, `${person.name} è già stato registrato.`, "error", 4000); // Cambiato da 'warning' a 'error' per il colore rosso
  } else {
    checkin.push({id: person.id, name: person.name, department: person.department, time: time});
    spanText.textContent = `✅ Check-in: ${person.name} (${person.id}) - ${person.department}`;
    li.style.color = "green";
    downloadLogButton.style.display = 'inline-block';
    showMessage(scannerMessageDiv, `Check-in di ${person.name} registrato con successo!`, "success", 4000);
  }
  li.appendChild(spanText);
  li.appendChild(spanTime);
  checkinLogList.prepend(li); // Aggiungi il nuovo log in cima
  checkinLogList.scrollTop = 0; // Scorre automaticamente in cima per mostrare l'ultimo log
}

// Inizializzazione dello scanner
document.addEventListener('DOMContentLoaded', () => {
  if (typeof Html5Qrcode !== 'undefined') {
    const html5QrCode = new Html5Qrcode("reader");
    const qrCodeConfig = {
      fps: 10, // Frame per secondo per la scansione
      qrbox: { width: 250, height: 250 }, // Dimensioni del box di scansione
      rememberLastUsedCamera: true, // Ricorda l'ultima fotocamera usata
      // Altre configurazioni avanzate:
      // disableFlip: false, // Disabilita la lettura di QR specchiati (per alcune telecamere)
      // videoConstraints: { facingMode: { exact: "environment" } } // Forza la fotocamera posteriore (più preciso)
    };

    html5QrCode.start(
      { facingMode: "environment" }, // Preferisce la fotocamera posteriore
      qrCodeConfig,
      onScanSuccess,
      (errorMessage) => {
        // Callback per gli errori di scansione (es. nessun QR trovato nel frame)
        // Utile per il debug, ma può essere molto verboso in produzione
        // console.warn(`Scan error: ${errorMessage}`);
      }
    )
    .then(() => {
      showMessage(scannerMessageDiv, "Scanner pronto! Inquadra un QR code per il check-in.", "success", 5000);
    })
    .catch(err => {
      console.error("Errore all'avvio dello scanner:", err);
      let errorMsg = `Errore: Impossibile avviare lo scanner. Assicurati che la tua fotocamera sia accessibile.`;
      if (err.message.includes("NotAllowedError") || err.message.includes("Permission denied")) {
        errorMsg += " Controlla le autorizzazioni della fotocamera nel tuo browser.";
      }
      showMessage(scannerMessageDiv, errorMsg, "error", 10000);
      readerDiv.innerHTML = "<p style='color: red; padding: 10px;'>Errore: Scanner non disponibile. Impossibile avviare la fotocamera. Riprova o controlla i permessi.</p>";
    });
  } else {
    console.error("Html5Qrcode non è stato caricato correttamente. Controlla la URL dello script.");
    showMessage(scannerMessageDiv, "Errore critico: La libreria dello scanner non è stata caricata. Lo scanner non è disponibile.", "error", 10000);
    readerDiv.innerHTML = "<p style='color: red; padding: 10px;'>Errore: Scanner non disponibile. Impossibile caricare la libreria Html5Qrcode.</p>";
  }
});


// =========================================================================
// 3. Download Log CSV
// =========================================================================

downloadLogButton.addEventListener('click', function() {
  if (checkin.length === 0) {
    showMessage(logMessageDiv, "Nessun check-in registrato per scaricare il log.", "warning");
    return;
  }

  // Intestazione CSV con i campi corretti
  let csvContent = "ID,Nome Completo,Reparto,DataOra Check-in\n";
  checkin.forEach(c => {
    // Gestisce eventuali virgole o doppi apici nel nome e reparto racchiudendoli tra virgolette e raddoppiando gli apici interni
    const escapedName = `"${c.name.replace(/"/g, '""')}"`;
    const escapedDepartment = `"${(c.department || '').replace(/"/g, '""')}"`; // Gestisce il caso in cui il reparto non sia definito
    csvContent += `${c.id},${escapedName},${escapedDepartment},${c.time}\n`;
  });

  try {
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    saveAs(blob, "checkin_log.csv");
    showMessage(logMessageDiv, "Log CSV scaricato con successo! ✅", "success");
  } catch (error) {
    console.error("Errore nel download del log CSV:", error);
    showMessage(logMessageDiv, `Errore durante il download del log CSV: ${error.message}`, "error");
  }
});
</script>

</body>
</html>
