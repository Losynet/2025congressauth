<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo - Losenno Giovanni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .profile-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border-top: 5px solid #007bff;
        }
        .profile-card p {
            margin: 0; /* Rimuove il margine di default dei paragrafi */
        }
        .name {
            font-size: 2em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .location {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
        }
        .department {
            font-size: 1em;
            font-style: italic;
            color: #777;
            background-color: #e9ecef;
            padding: 8px 12px;
            border-radius: 20px;
            display: inline-block; /* Per far sì che lo sfondo si adatti al testo */
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <p class="name">Losenno Giovanni</p>
        <p class="location">Pisticci Bernalda</p>
        <p class="department">Uscieri</p>
    </div>
</body>
</html>
